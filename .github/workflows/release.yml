name: release

# Publishes npryx to npm from CI with provenance, so `npryx npryx` shows its own
# "provenance ✓". Triggered by publishing a GitHub release (tag vX.Y.Z).

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance / trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      # Trusted publishing (configured on npmjs.com for this workflow and the npm
      # environment): npm exchanges the job's OIDC token, so no npm token exists.
      - run: npm publish --provenance --access public
