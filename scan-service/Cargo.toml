[package]
name = "npryx-scan"
version = "0.1.0"
edition = "2021"
description = "Opt-in remote scanner for npryx: static and sandbox analysis of npm packages for data exfiltration and supply-chain red flags"
license = "ISC"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "npryx-scan"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
getrandom = "0.2"
flate2 = "1"
tar = "0.4"
oxc_allocator = "0.152"
oxc_parser = "0.152"
oxc_ast = "0.152"
oxc_ast_visit = "0.152"
oxc_span = "0.152"
oxc_syntax = "0.152"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

[dev-dependencies]
tempfile = "3"
